<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sistema Marketplace — Líder</title>
<style>
  :root{
    --bg:#f4f6fb;--panel:#fff;--ink:#1a2233;--muted:#64708a;--line:#e5e9f2;
    --brand:#1f3a8a;--brand-2:#2b4bd6;--sidebar:#101a33;--sidebar-ink:#c3cce0;
    --ok:#0f9d6b;--ok-bg:#e6f6ee;--warn:#c47f00;--warn-bg:#fdf3e0;
    --err:#d13b3b;--err-bg:#fbe9e9;--info:#2b6fd6;--info-bg:#e8f0fc;--neutral:#5b6478;--neutral-bg:#eef1f7;
    --radius:12px;--shadow:0 1px 2px rgba(16,26,51,.06),0 6px 18px rgba(16,26,51,.05);
  }
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer}
  .hidden{display:none!important}
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{background:var(--sidebar);color:var(--sidebar-ink);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:12px}
  .logo-badge{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
  .brand b{color:#fff;font-size:15px}.brand small{display:block;color:#8b97b6;font-size:11px}
  .nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6d7aa0;margin:16px 8px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--sidebar-ink);font-weight:500;margin-bottom:2px}
  .nav a .ic{width:18px;text-align:center;opacity:.9}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.active{background:var(--brand-2);color:#fff}
  .nav a.soon{opacity:.5;cursor:default}
  .nav a .soon-tag{margin-left:auto;font-size:9.5px;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:6px}
  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5}
  .crumbs{font-size:12.5px;color:var(--muted)}.crumbs b{color:var(--ink)}.spacer{flex:1}
  .top-store{display:flex;align-items:center;gap:8px;font-size:13px;border:1px solid var(--line);padding:6px 10px;border-radius:8px;background:#fbfcfe}
  .top-store .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
  .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .content{padding:24px 26px;max-width:1320px;width:100%}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;gap:16px;flex-wrap:wrap}
  .page-head h2{margin:0;font-size:20px}.page-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
  .info-banner{background:var(--info-bg);border:1px solid #cfe0fb;color:#1b4c99;border-radius:10px;padding:9px 14px;font-size:12.5px;margin-bottom:14px}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:16px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
  .kpi .lbl{font-size:12px;color:var(--muted);font-weight:600}.kpi .val{font-size:20px;font-weight:750;margin-top:8px}
  .kpi.clickable{cursor:pointer;transition:.12s}.kpi.clickable:hover{border-color:var(--brand-2);box-shadow:0 2px 6px rgba(43,75,214,.12)}
  .kpi.on{border-color:var(--brand-2);background:#f5f8ff}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .panel .ph{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .panel .ph h3{margin:0;font-size:14.5px}.pb{padding:16px}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
  .tab:hover{color:var(--ink)}.tab.active{color:var(--brand-2);border-bottom-color:var(--brand-2)}
  .importbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:16px}
  .importbar .ib-title{font-weight:700;font-size:13.5px}.importbar .ib-meta{color:var(--muted);font-size:12px}
  .toolbar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .input,.select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:13px;color:var(--ink)}
  .input.sm,.select.sm{padding:7px 10px;font-size:12.5px;border-radius:8px}
  .input:focus,.select:focus{outline:none;border-color:var(--brand-2)}
  label.fld{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px;font-weight:600}
  .link-btn{background:none;border:none;color:var(--brand-2);font-weight:600;font-size:12.5px;padding:0;cursor:pointer}
  .link-btn:disabled{color:var(--muted);cursor:default}
  .count-line{font-size:12.5px;color:var(--muted);margin:2px 0 12px}.count-line b{color:var(--ink)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:#fff;border:none;padding:6px 10px;font-size:12px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--brand-2);color:#fff}
  .selbanner{background:var(--info-bg);border:1px solid #cfe0fb;color:#1b4c99;border-radius:10px;padding:8px 14px;font-size:12.5px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .table-wrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th{text-align:left;padding:10px 14px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfcfe}
  td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:600}
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-err{background:var(--err-bg);color:var(--err)}.b-info{background:var(--info-bg);color:var(--info)}.b-neutral{background:var(--neutral-bg);color:var(--neutral)}
  .btn-sm{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--brand)}
  .btn-sm:hover{background:#f0f4ff;border-color:var(--brand-2)}
  .btn-sm.primary{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
  .btn-sm:disabled{opacity:.5;cursor:default}
  .empty{padding:48px;text-align:center;color:var(--muted)}.empty .ico{font-size:34px;opacity:.4}
  .master-row>td{background:#fbfcff;border-top:1px solid var(--line)}
  .master-row .pname{font-weight:700}
  .subrow>td{background:#fff}.subrow .vname{font-weight:600}
  tr.matched>td{background:#fff8e6}
  .chk{width:15px;height:15px;cursor:pointer;accent-color:var(--brand-2)}
  .expander{border:1px solid var(--line);background:#fff;border-radius:6px;width:22px;height:22px;font-weight:700;color:var(--brand);line-height:1;cursor:pointer;padding:0}
  .tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10.5px;font-weight:700;background:var(--neutral-bg);color:var(--neutral)}
  .tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--info-bg);color:var(--info)}.tag.ok{background:var(--ok-bg);color:var(--ok)}
  .inh-cost{color:var(--muted);font-size:11px}
  .cell-fam,.cell-close,.cell-cost{cursor:pointer;border-radius:6px}
  .cell-fam:hover,.cell-close:hover,.cell-cost:hover{background:#eef3ff;outline:1px dashed var(--brand-2)}
  .inl{padding:5px 8px;font-size:12.5px}
  .subwrap>td{padding:0}
  .subwrap table{min-width:0}
  .bulkbar{position:sticky;bottom:14px;z-index:20;background:var(--sidebar);color:#fff;border-radius:12px;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(16,26,51,.35);margin-top:12px}
  .bulkbar b{font-size:14px}.bulkbar .spacer{flex:1}
  .bulkbar .btn-sm{background:rgba(255,255,255,.1);border-color:transparent;color:#fff}
  .bulkbar .btn-sm:hover{background:rgba(255,255,255,.2)}.bulkbar .btn-sm.primary{background:#fff;color:var(--brand)}
  .overlay{position:fixed;inset:0;background:rgba(16,26,51,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:14px;width:520px;max-width:96vw;box-shadow:0 30px 80px rgba(0,0,0,.4)}
  .modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal .mh h3{margin:0;font-size:16px}.modal .mbd{padding:20px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .x{border:none;background:none;font-size:20px;color:var(--muted);cursor:pointer}
  .drawer{position:fixed;inset:0;background:rgba(16,26,51,.45);display:flex;justify-content:flex-end;z-index:60}
  .drawer-panel{background:#fff;width:440px;max-width:96vw;height:100%;box-shadow:-20px 0 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
  .drawer-panel .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .drawer-panel .dbd{padding:20px;overflow:auto;flex:1}
  .drawer-panel .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .ro{background:#f6f8fc;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
  .footnote{color:var(--muted);font-size:11.5px;margin-top:10px}
  .form-err{background:var(--err-bg);color:var(--err);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-top:10px}
  .toast{position:fixed;right:22px;bottom:22px;z-index:80;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;box-shadow:0 12px 30px rgba(16,26,51,.2);padding:12px 16px;max-width:380px;font-size:12.5px}
  .toast.err{border-left-color:var(--err)}.toast .tt{font-weight:700;margin-bottom:2px}
  .dz{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;cursor:pointer;background:#fbfcfe}
  .dz.over{border-color:var(--brand-2);background:#f0f4ff}
  .seedbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  /* --- extras do sistema unificado --- */
  .cards6{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px}
  .fcard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);box-shadow:var(--shadow)}
  .fcard .lbl{font-size:11.5px;color:var(--muted);font-weight:600}
  .fcard .val{font-size:19px;font-weight:750;margin-top:6px}
  .fcard.blue .val{color:var(--brand-2)}.fcard.green .val{color:var(--ok)}.fcard.red .val{color:var(--err)}.fcard.amber .val{color:var(--warn)}
  .fin-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .fin-line.total{font-weight:750;border-bottom:none}.fin-line .neg{color:var(--err)}.fin-line .pos{color:var(--ok)}
  .drawer-wide .drawer-panel{width:900px}
  .split{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
  @media(max-width:1000px){.split{grid-template-columns:1fr}}
  .chatbox{display:flex;flex-direction:column;height:560px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
  .chatlog{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:85%;padding:10px 13px;border-radius:12px;font-size:13px;line-height:1.5}
  .msg.u{align-self:flex-end;background:var(--brand-2);color:#fff;border-bottom-right-radius:3px}
  .msg.a{align-self:flex-start;background:#f2f5fb;color:var(--ink);border-bottom-left-radius:3px}
  .msg .cites{margin-top:8px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px}
  .chatin{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  .chatin input{flex:1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
  .chip{font-size:11.5px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:5px 10px;cursor:pointer;color:var(--brand)}
  .chip:hover{background:#f0f4ff;border-color:var(--brand-2)}
  .prev{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);padding:16px;position:sticky;top:80px}
  .prev h4{margin:0 0 10px;font-size:13px}
  .prev .row{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .aicfg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .subtabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
  .subtab{padding:7px 12px;font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);cursor:pointer}
  .subtab.active{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}
  .pill.NAO_PAGO{background:var(--neutral-bg);color:var(--neutral)}
  .pill.A_ENVIAR{background:var(--warn-bg);color:var(--warn)}
  .pill.ENVIADO{background:var(--info-bg);color:var(--info)}
  .pill.CONCLUIDO{background:var(--ok-bg);color:var(--ok)}
  .pill.CANCELADO{background:var(--err-bg);color:var(--err)}
  .pill.OUTRO{background:var(--neutral-bg);color:var(--neutral)}
  .chip.chip-on{background:var(--brand-2);color:#fff;border-color:var(--brand-2)}
  /* ===== Estilo "relatório" (dashboards de Devolução) ===== */
  .rhead{margin:2px 0 16px}
  .rhead .eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#e0662a}
  .rhead h3.rtitle{margin:4px 0 2px;font-size:22px;font-weight:800;color:var(--ink);border:none;padding:0}
  .rhead .rsub{color:var(--muted);font-size:13.5px;margin:0;max-width:760px}
  .rhead .rule{height:3px;background:linear-gradient(90deg,#e0662a,#e0662a 120px,var(--line) 120px);border-radius:2px;margin-top:10px}
  .kstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .kstrip .kc{padding:16px 18px;border-right:1px solid var(--line);min-width:0}
  .kstrip .kc:last-child{border-right:none}
  .kstrip .kc .kl{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .kstrip .kc .kv{font-size:26px;font-weight:800;margin-top:6px;line-height:1.05;overflow-wrap:break-word}
  .kstrip .kc .ks{font-size:11.5px;color:var(--muted);margin-top:4px}
  .kstrip .kc.red .kv{color:var(--err)}.kstrip .kc.amber .kv{color:var(--warn)}.kstrip .kc.green .kv{color:var(--ok)}.kstrip .kc.blue .kv{color:var(--brand-2)}.kstrip .kc.orange .kv{color:#e0662a}
  @media(max-width:720px){.kstrip .kc{border-right:none;border-bottom:1px solid var(--line)}}
  /* ---- Caixa: visual financeiro profissional (prompt "Refazer layout do Fechamento") ---- */
  .cx-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .cx-head b{font-size:17px}
  .cx-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  /* Parte 5 do prompt "Correção do custo + taxas...": cada assunto do fechamento precisa da SUA
     PRÓPRIA caixa — fundo, borda, cabeçalho, corpo e espaçamento externo — nunca parecer continuação
     visual do bloco anterior. Cabeçalho "sangra" as bordas via margin negativo (sem mudar o HTML dos
     ~7 pontos de chamada que só fazem <div class="cx-section"><h4>Título</h4>...conteúdo...</div>). */
  .cx-section{margin:22px 0;padding:14px 16px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}
  .cx-section:first-child{margin-top:0}
  .cx-section h4{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:-14px -16px 12px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg2,#f7f8fa);border-radius:12px 12px 0 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .cx-h4-sub{font-size:12px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap}
  .cx-flow{display:flex;align-items:stretch;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .cx-flow-step{flex:1;min-width:110px;padding:12px 14px;text-align:center;border-right:1px dashed var(--line);position:relative}
  .cx-flow-step:last-child{border-right:none}
  .cx-flow-step .cxl{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .cx-flow-step .cxv{font-size:17px;font-weight:800;margin-top:4px}
  .cx-flow-step.neg .cxv{color:var(--err)}.cx-flow-step.pos .cxv{color:var(--ok)}.cx-flow-step.neu .cxv{color:var(--brand-2)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:900px){.grid2{grid-template-columns:1fr}}
  .cx-flow-step:not(:last-child)::after{content:'→';position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;z-index:1}
  @media(max-width:640px){.cx-flow{flex-direction:column}.cx-flow-step{border-right:none;border-bottom:1px dashed var(--line);text-align:left}.cx-flow-step:last-child{border-bottom:none}.cx-flow-step:not(:last-child)::after{content:'↓';right:auto;left:14px;top:auto;bottom:-9px;transform:none}}
  .cx-kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
  .cx-kv .cxl{color:var(--muted)}
  .cx-kv .cxv{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
  .cx-badge{display:inline-block;padding:1px 6px;border-radius:5px;font-size:10px;font-weight:700;background:var(--info-bg);color:var(--info)}
  details.cx-collapse{border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
  details.cx-collapse>summary{cursor:pointer;padding:10px 14px;font-weight:700;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center;background:var(--bg2,#f7f8fa)}
  details.cx-collapse>summary::-webkit-details-marker{display:none}
  details.cx-collapse>summary::after{content:'▸';color:var(--muted);font-size:11px}
  details.cx-collapse[open]>summary::after{content:'▾'}
  details.cx-collapse>.pb{padding:10px 14px}
  .cx-footer{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .callout{border-radius:12px;padding:14px 16px 15px;margin-bottom:16px;border-left:4px solid var(--info);background:var(--info-bg)}
  .callout .ct{font-weight:800;font-size:13.5px;margin-bottom:5px;color:#1b4c99}
  .callout .cbody{font-size:13px;line-height:1.5;color:var(--ink)}
  .callout.warn{border-left-color:#e0662a;background:#fdf1e9}.callout.warn .ct{color:#b5501e}
  .callout.red{border-left-color:var(--err);background:var(--err-bg)}.callout.red .ct{color:#a52a2a}
  .callout.green{border-left-color:var(--ok);background:var(--ok-bg)}.callout.green .ct{color:#0b7350}
  .chartcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px}
  .chartcard .cch{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;gap:6px}
  .chartcard .cch h4{margin:0;font-size:14.5px;font-weight:750}
  .chartcard .cleg{font-size:11.5px;color:var(--muted)}
  .chartcard .cleg .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:middle}
  td.cell-text{white-space:normal;overflow-wrap:anywhere;line-height:1.35;max-width:340px;min-width:180px}
  td.nowrap{white-space:nowrap}
  table.report thead th{background:#2b3444;color:#e7ecf5;border-bottom:none}
  table.report tbody tr:nth-child(even) td{background:#fafbfd}
  table.report tbody tr.total td{background:#fdf1e9;font-weight:750;border-top:2px solid #f0d3bf}
  table.report td .bad{color:var(--err);font-weight:750}
  .rowlink{cursor:pointer}.rowlink:hover td{background:#eef3ff !important}
  .datein{display:none;gap:6px;align-items:center}
  .datein.on{display:inline-flex}
  .datein input{padding:6px 8px;font-size:12px}
  /* §125-129 do prompt mestre: impressão/PDF do Fechamento de Caixa nunca imprime a tela inteira
     (sidebar/topbar/filtros/botões) — só o documento dedicado montado em #caixa-print-doc. */
  #caixa-print-doc{display:none}
  .pdoc{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1a2233;font-size:12px}
  .pdoc h1{font-size:18px;margin:0 0 4px}
  .pdoc h2{font-size:13px;margin:16px 0 6px;padding-bottom:4px;border-bottom:1.5px solid #1a2233;text-transform:uppercase;letter-spacing:.03em}
  .pdoc .psub{color:#64708a;margin:0 0 14px}
  .pdoc table{width:100%;border-collapse:collapse;margin-bottom:4px}
  .pdoc thead{display:table-header-group}
  .pdoc th,.pdoc td{border:1px solid #d8dee8;padding:4px 6px;text-align:left;font-size:11px;word-break:break-word}
  .pdoc th{background:#eef1f7}
  .pdoc tr{page-break-inside:avoid}
  .pdoc .prow{display:flex;justify-content:space-between;border-bottom:1px solid #eef1f7;padding:2px 0}
  .pdoc .ptotal{font-weight:700;border-top:1.5px solid #1a2233;margin-top:2px;padding-top:4px}
  .pdoc .pneg{color:#a02020}.pdoc .ppos{color:#0f7a4f}
  .pdoc .psection{page-break-inside:avoid;margin-bottom:10px}
  .pdoc .pfooter{margin-top:18px;padding-top:8px;border-top:1px solid #1a2233;font-size:11px;color:#64708a}
  @media print{
    body *{visibility:hidden}
    #caixa-print-doc,#caixa-print-doc *{visibility:visible}
    #caixa-print-doc{display:block;position:absolute;left:0;top:0;width:100%}
    @page{size:A4;margin:16mm 12mm}
  }
</style>
