name: Deploy Staging (GitHub Pages)

on:
  push:
    branches: [claude/shopee-ops-platform-mcb1ra]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-staging.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publica o conteúdo de docs/ exatamente como está no repositório — nenhum
      # arquivo é reescrito, reconstruído ou convertido. A única adição é um
      # selo discreto (canto inferior direito) com o commit publicado e o
      # horário do deploy, inserido só na cópia servida pelo Pages — o arquivo
      # em docs/sistema-marketplace.html no repositório permanece intocado.
      - name: Preparar site (cópia fiel de docs/)
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp docs/sistema-marketplace.html _site/index.html
          SHORT_SHA="${COMMIT_SHA::7}"
          DEPLOYED_AT="$(date -u +'%Y-%m-%d %H:%M UTC')"
          echo "commit=${COMMIT_SHA}" > _site/BUILD.txt
          echo "commit_short=${SHORT_SHA}" >> _site/BUILD.txt
          echo "deployed_at=${DEPLOYED_AT}" >> _site/BUILD.txt
          python3 - "$SHORT_SHA" "$DEPLOYED_AT" _site/index.html _site/sistema-marketplace.html <<'PY'
          import sys
          short_sha, deployed_at, *files = sys.argv[1:]
          badge = (
              '<div id="__staging_build_badge" style="position:fixed;right:8px;bottom:8px;'
              'z-index:999999;background:rgba(16,26,51,.85);color:#fff;'
              'font:11px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;'
              'padding:4px 9px;border-radius:6px;opacity:.85;pointer-events:none">'
              f'Build {short_sha} &middot; {deployed_at}</div></body>'
          )
          for path in files:
              with open(path, 'r', encoding='utf-8') as f:
                  content = f.read()
              if '</body>' not in content:
                  raise SystemExit(f'</body> not found in {path}')
              content = content.replace('</body>', badge, 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
